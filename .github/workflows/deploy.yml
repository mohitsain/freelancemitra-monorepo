name: Manual Deploy Develop

on:
  # This enables the "Run workflow" button in GitHub Actions
  workflow_dispatch:
    inputs:
      log_message:
        description: 'Reason for deployment (Optional)'
        required: false
        default: 'Manual update'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true 
          script: |
            echo "Starting deployment: ${{ github.event.inputs.log_message }}"
            
            # 1. Navigate to directory
            cd /home/ubuntu/freelancemitra/freelancemitra-monorepo
            
            # 2. Fix Permissions
            sudo chown -R ubuntu:ubuntu .
            
            # 3. Clean local changes & Update
            # 'git reset --hard' ensures manual edits on the server don't block the pull
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            git pull origin develop
            
            # 4. Restart services
            # Using --pull ensures Docker grabs the latest base images
            sudo docker compose down
            sudo docker compose up -d --build --pull
            
            # 5. Maintenance
            sudo docker image prune -f
            echo "Deployment successful!"