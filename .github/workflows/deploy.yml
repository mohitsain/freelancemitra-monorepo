name: Deploy Develop Branch

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true 
          script: |
            # 1. Navigate to directory
            cd /home/ubuntu/freelancemitra/freelancemitra-monorepo
            
            # 2. FIX PERMISSIONS (Solves the FETCH_HEAD error)
            # This ensures the 'ubuntu' user owns all files, even if created by root/docker previously
            sudo chown -R ubuntu:ubuntu .
            
            # 3. Update the code
            git fetch origin develop
            git checkout develop
            git pull origin develop
            
            # 4. Restart services
            # Using 'sudo' here ensures docker has the permissions it needs
            sudo docker compose down
            sudo docker compose up -d --build
            
            # 5. Maintenance
            sudo docker image prune -f
            echo "Deployment successful!"