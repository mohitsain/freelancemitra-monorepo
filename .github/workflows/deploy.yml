name: Manual Deploy Develop

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you deploying?'
        required: false
        default: 'Manual update'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This MUST match your GitHub Settings > Environments name exactly
    environment: development 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true 
          script: |
            echo "Deployment initiated for: ${{ github.event.inputs.reason }}"
            
            # 1. Navigate to directory
            cd /home/ubuntu/freelancemitra/freelancemitra-monorepo
            
            # 2. Fix Permissions
            # Ensures the 'ubuntu' user owns the files to avoid the FETCH_HEAD error
            sudo chown -R ubuntu:ubuntu .
            
            # 3. Force Sync with GitHub
            # git reset --hard is used to clear any accidental local edits on the EC2
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop
            git pull origin develop
            
            # 4. Restart Services
            # --build ensures your latest code changes are baked into the new containers
            sudo docker compose down
            sudo docker compose up -d --build
            
            # 5. Maintenance
            # Removes old Docker images to keep your EC2 disk from getting full
            sudo docker image prune -f
            
            echo "✅ Deployment finished successfully!"